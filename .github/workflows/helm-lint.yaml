name: Helm Lint

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm Toolchain
        uses: azure/setup-helm@v4
        with:
          version: "4.0.0"

      - name: Run Helm Lint on Chart
        run: helm lint .
