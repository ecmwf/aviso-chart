{{- if and .Values.metrics .Values.metrics.grafanaDashboard .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aviso-server.fullname" . }}-grafana-dashboard
  labels:
    {{- include "aviso-server.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  aviso-server.json: |-
{{ .Files.Get "dashboards/aviso-server.json" | indent 4 }}
{{- end }}
