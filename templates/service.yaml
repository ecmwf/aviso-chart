apiVersion: v1
kind: Service
metadata:
  name: {{ include "aviso-server.fullname" . }}
  labels:
    {{- include "aviso-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.config.metrics .Values.config.metrics.enabled .Values.config.metrics.port }}
    - port: {{ .Values.config.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "aviso-server.selectorLabels" . | nindent 4 }}
