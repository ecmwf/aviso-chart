# ECPDS destination-authorization profile.
#
# Requires the "<version>-ecpds" image flavor. The core image does not
# contain the plugin and will refuse to start if any stream references
# plugins: ["ecpds"].
#
# Prerequisites:
#   kubectl create secret generic aviso-ecpds-secret \
#     --from-literal=username=ecpds-service-account \
#     --from-literal=password=service-password

image:
  tag: "0.5.0-ecpds"

extraEnv:
  - name: AVISOSERVER_ECPDS__USERNAME
    valueFrom:
      secretKeyRef:
        name: aviso-ecpds-secret
        key: username
  - name: AVISOSERVER_ECPDS__PASSWORD
    valueFrom:
      secretKeyRef:
        name: aviso-ecpds-secret
        key: password

config:
  ecpds:
    servers:
      - "https://ecpds-primary.example.int"
      - "https://ecpds-secondary.example.int"
    match_key: "destination"
    target_field: "name"
    cache_ttl_seconds: 300
    max_entries: 10000
    request_timeout_seconds: 30
    connect_timeout_seconds: 5
    partial_outage_policy: strict

  # A stream that opts into the ECPDS plugin. The destination identifier
  # must be required so the plugin always has a value to authorize.
