# Optional name overrides. Leave empty for release-based naming.
nameOverride: ""
fullnameOverride: ""

# Base deployment size. Keep minimal in chart defaults; scale via overrides.
replicaCount: 1

# Container image for aviso-server.
#
# The published "<version>" image is built with the ECPDS destination
# authorization plugin compiled in; enabling it is purely a configuration
# decision (config.ecpds plus plugins: ["ecpds"] in a stream's auth block).
# There is no separate "-ecpds" image flavor.
image:
  repository: eccr.ecmwf.int/aviso/aviso_server
  # Use IfNotPresent for stable clusters; switch to Always in rapid dev loops.
  pullPolicy: IfNotPresent
  # Empty by default: the deployment template falls back to Chart.yaml's
  # appVersion so the image tag always tracks the chart release without a
  # second source of truth to maintain. Override here (or via --set image.tag)
  # only when you need a non-default tag such as "<version>-rc1" for a
  # pre-release or "<version>-<sha>" for an exact-build pin.
  tag: ""

# Private registry credentials (disabled by default).
# Example override:
# imagePullSecrets:
#   enabled: true
#   registry: eccr.ecmwf.int
#   username: <user>
#   password: <token>
imagePullSecrets:
  enabled: false
  registry: eccr.ecmwf.int
  username: ""
  password: ""

service:
  type: ClusterIP
  port: 8000
  # Optional annotations on the aviso Service resource.
  annotations: {}

# Pod-level Kubernetes controls. Keep empty in base chart; override per environment.
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress is opt-in. Configure host/TLS in your override values.
#
# streamingTuning emits the ingress-controller annotations required for
# aviso's long-lived SSE connections. Aviso watch endpoints stay open for
# up to config.watch_endpoint.connection_max_duration_sec (default 3600),
# so the default proxy timeouts of most controllers (~60s) will drop
# connections mid-stream unless these are set.
#
# Supported controllers:
#   - "nginx-org"      F5 NGINX Ingress Controller (nginx.org/* keys)
#   - "ingress-nginx"  Kubernetes ingress-nginx     (nginx.ingress.kubernetes.io/* keys)
#   - ""               Disable auto-emit; rely solely on ingress.annotations.
#
# Operator-supplied entries in ingress.annotations always win on key
# collision, so an explicit override of any individual annotation still
# works without disabling the whole block.
#
# Example override:
# ingress:
#   enabled: true
#   className: nginx
#   hosts:
#     - host: aviso.example.com
#       paths:
#         - path: /
#           pathType: Prefix
ingress:
  enabled: false
  className: ""
  annotations: {}
  streamingTuning:
    enabled: true
    controller: "nginx-org"
    proxyBuffering: false
    proxyReadTimeoutSeconds: 3600
    proxySendTimeoutSeconds: 3600
  hosts:
    - host: aviso.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Horizontal Pod Autoscaler. Disabled by default for predictable baseline behavior.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Conservative default resources for a single-replica baseline.
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Liveness stays on /health (pure process liveness): a backend outage
# must not kill the pod, since the NATS client reconnects on its own.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

# Readiness uses /ready (aviso-server >= 0.9.0): 200 while the notification
# backend connection is healthy, 503 while it is down or reconnecting, so
# traffic routes away during a backend outage and resumes on reconnect.
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Shared JWT secret for aviso and auth-o-tron (disabled by default).
# When enabled, creates a Kubernetes Secret that both services can reference via extraEnv.
# The secret name must match the secretKeyRef entries in extraEnv below.
authSecret:
  enabled: false
  name: "aviso-auth-secret"
  jwtSecret: ""

# Extra environment variables injected into the aviso-server container.
# Use this for secrets that should not live in the ConfigMap.
# Aviso supports AVISOSERVER_* env overrides on top of the config file
# (nested keys use "__"). RUST_LOG is also honored for runtime log
# directive overrides without a redeploy.
# Example:
# extraEnv:
#   - name: AVISOSERVER_AUTH__JWT_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: aviso-auth-secret
#         key: jwt-secret
#   - name: AVISOSERVER_NOTIFICATION_BACKEND__JETSTREAM__TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: aviso-nats-secret
#         key: token
#   - name: RUST_LOG
#     value: "info,aviso_server::auth=debug"
extraEnv: []

# Kubernetes plumbing for the Prometheus metrics server.
# The server-side metrics endpoint is configured under config.metrics
# (enabled / host / port). This block only controls the ServiceMonitor
# resource emitted by the chart for Prometheus Operator discovery.
# Requires config.metrics.enabled=true and config.metrics.port set.
metrics:
  serviceMonitor:
    enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # Extra labels to match your Prometheus selector (for example release: prometheus).
    # labels: {}

# Raw aviso-server configuration rendered into config.yaml.
config:
  application:
    host: "0.0.0.0"
    port: 8000
    # Used in generated CloudEvents source/schema URLs.
    base_url: "http://aviso-server"
    static_files_path: "/app/static"

  # Keep these aligned with aviso-server runtime defaults.
  watch_endpoint:
    sse_heartbeat_interval_sec: 30
    connection_max_duration_sec: 3600
    # Positive global internal fetch batch size, not the delivered replay cap.
    replay_batch_size: 100
    # Positive delivered replay cap after filters/rendering; schemas may override.
    max_historical_notifications: 10000
    replay_batch_delay_ms: 100
    concurrent_notification_processing: 15

  notification_backend:
    # Base chart default: in-memory backend.
    kind: in_memory
    in_memory:
      max_history_per_topic: 1
      max_topics: 10000
      enable_metrics: false

    # External JetStream example (override file):
    # kind: jetstream
    # jetstream:
    #   nats_url: "nats://nats:4222"
    #   timeout_seconds: 30
    #   retry_attempts: 10
    #   max_messages: 500000
    #   max_bytes: 2147483648
    #   retention_time: "7d"
    #   storage_type: file
    #   replicas: 1
    #   retention_policy: limits
    #   discard_policy: old
    #   max_reconnect_attempts: 10
    #   reconnect_delay_ms: 1000
    #   publish_retry_attempts: 3
    #   publish_retry_base_delay_ms: 50

  logging:
    level: info
    # Compatibility field in aviso-server. Runtime output is structured JSON.
    format: json
    # Optional push-based OTLP log export (aviso-server >= 0.8). Logs are
    # always written to stdout; when enabled they are additionally pushed
    # to the collector endpoint. Collectors conventionally listen on 4317
    # for grpc and 4318 for http. A missing scheme defaults to http://.
    # Example override:
    # otlp:
    #   enabled: true
    #   endpoint: "http://otel-collector.observability.svc:4317"
    #   protocol: grpc   # grpc | http

  # Authentication and authorization (disabled by default).
  # When enabled, admin endpoints always require auth + admin_roles.
  # Stream endpoints enforce auth only when the schema sets auth.required: true.
  # jwt_secret must be injected via extraEnv (AVISOSERVER_AUTH__JWT_SECRET) — not here.
  # Example override:
  # auth:
  #   enabled: true
  #   mode: direct
  #   auth_o_tron_url: "http://RELEASE_NAME-auth-o-tron:8080"
  #   admin_roles:
  #     localrealm: ["admin"]
  #   timeout_ms: 5000
  auth:
    enabled: false
    mode: direct
    auth_o_tron_url: ""
    admin_roles: {}
    timeout_ms: 5000

  # Prometheus metrics endpoint (disabled by default).
  # Runs on a separate internal port. host defaults to "0.0.0.0" so the
  # Service port can reach the metrics server inside the pod; aviso-server's
  # own default is "127.0.0.1" (loopback), which would silently break
  # scraping in Kubernetes.
  # Example override:
  # metrics:
  #   enabled: true
  #   host: "0.0.0.0"
  #   port: 9090
  metrics:
    enabled: false
    host: "0.0.0.0"
    # port: 9090

  # Optional ECPDS destination-authorization plugin (disabled by default).
  # The published image ships with the plugin compiled in; a stream opts in
  # via auth.plugins: ["ecpds"]. The plugin runs on watch/replay only; it
  # never blocks notify.
  #
  # Credentials are HTTP Basic auth against the ECPDS API; inject them via
  # extraEnv, do not hard-code them here:
  #   - name: AVISOSERVER_ECPDS__USERNAME
  #     valueFrom: { secretKeyRef: { name: aviso-ecpds-secret, key: username } }
  #   - name: AVISOSERVER_ECPDS__PASSWORD
  #     valueFrom: { secretKeyRef: { name: aviso-ecpds-secret, key: password } }
  #
  # Example override:
  # ecpds:
  #   servers:
  #     - "https://ecpds-primary.example.int"
  #     - "https://ecpds-secondary.example.int"
  #   match_key: "destination"
  #   target_field: "name"
  #   cache_ttl_seconds: 300
  #   max_entries: 10000
  #   request_timeout_seconds: 30
  #   connect_timeout_seconds: 5
  #   partial_outage_policy: strict   # strict | any_success

  # Reject requests whose event_type is not in notification_schema.
  # When unset, aviso-server >= 0.6.0 derives:
  #   - true  when notification_schema has at least one entry (secure default)
  #   - false when notification_schema is empty or absent (legacy generic
  #     fallback for development setups)
  # Set explicitly to:
  #   - true  with no schema -> deny-all "drain" mode
  #   - false with a schema  -> preserve the legacy permissive behavior on
  #     0.6.0+. A startup warning is emitted in that case.
  # On older server versions (<= 0.5.x) this field is silently ignored.
  # notification_schema_strict: true

  # Schema-backed event types can be provided via overrides under:
  # config.notification_schema.<event_type>
  #
  # Top-level keys per stream:
  #   payload:        { required: bool }
  #   topic:          { base: str, key_order: [field, ...] }
  #   identifier:     { <field>: { description?, type, required, <handler-fields> } }
  #   auth:           { required, read_roles?, write_roles?, plugins? }
  #   storage_policy: { retention_time, max_messages, max_size, allow_duplicates, compression }
  #   max_historical_notifications: positive replay cap; omitted inherits watch_endpoint default
  #
  # Each identifier field uses a flat object:
  #   description: Optional human-readable text exposed by /api/v1/schema
  #   type:        Validation handler type (for example EnumHandler)
  #   required:    Whether the field is required
  #   <handler fields>: Handler-specific options (for example values, range, max_length)
  #
  # Example:
  # notification_schema:
  #   my_event:
  #     # Optional replay cap, outside storage_policy (which controls retention).
  #     max_historical_notifications: 5000
  #     payload:
  #       required: true
  #     topic:
  #       base: "my-event"
  #       key_order: ["region", "date"]
  #     auth:
  #       required: true
  #       read_roles:  { localrealm: ["*"] }
  #       write_roles: { localrealm: ["producer"] }
  #     storage_policy:
  #       retention_time: "7d"
  #       max_messages: 1000000
  #       max_size: "4Gi"
  #       allow_duplicates: false
  #       compression: true
  #     identifier:
  #       region:
  #         description: "Geographic region label."
  #         type: EnumHandler
  #         values: ["north", "south"]
  #         required: true
  #       date:
  #         type: DateHandler
  #         canonical_format: "%Y%m%d"
  #         required: false

# Optional bundled official NATS chart (default off; prefer explicit overrides).
# You can annotate subchart resources via official chart merge/patch points, for example:
# nats:
#   podTemplate:
#     merge:
#       metadata:
#         annotations:
#           key: value
#   service:
#     merge:
#       metadata:
#         annotations:
#           key: value
# When enabled for local/dev JetStream, override at least:
# nats:
#   enabled: true
#   config:
#     jetstream:
#       enabled: true
#       fileStore:
#         enabled: true
#         pvc:
#           enabled: true
#           size: 10Gi
nats:
  enabled: false

# Optional bundled auth-o-tron subchart (default off).
# When enabled, set config.auth.auth_o_tron_url to the in-cluster service URL:
#   config.auth.auth_o_tron_url: "http://RELEASE_NAME-auth-o-tron:8080"
# Override auth-o-tron-chart values under this key, for example:
# auth-o-tron:
#   enabled: true
#   config:
#     version: "2.0.0"
#     providers:
#       - name: "plain-provider"
#         type: "plain"
#         realm: "localrealm"
#         users:
#           - username: admin
#             password: admin
#     augmenters:
#       - name: "plain-role-augmenter"
#         type: "plain"
#         realm: "localrealm"
#         roles:
#           admin: ["admin"]
#   # Enable Prometheus metrics and ServiceMonitor for auth-o-tron.
#   metrics:
#     enabled: true
#     port: 9090
#     serviceMonitor:
#       enabled: true
#       interval: 30s
#       scrapeTimeout: 10s
auth-o-tron:
  enabled: false
