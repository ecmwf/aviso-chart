# Optional name overrides. Leave empty for release-based naming.
nameOverride: ""
fullnameOverride: ""

# Base deployment size. Keep minimal in chart defaults; scale via overrides.
replicaCount: 1

# Container image for aviso-server.
image:
  repository: eccr.ecmwf.int/aviso/aviso_server
  # Use IfNotPresent for stable clusters; switch to Always in rapid dev loops.
  pullPolicy: IfNotPresent
  tag: "0.4.0"

# Private registry credentials (disabled by default).
# Example override:
# imagePullSecrets:
#   enabled: true
#   registry: eccr.ecmwf.int
#   username: <user>
#   password: <token>
imagePullSecrets:
  enabled: false
  registry: eccr.ecmwf.int
  username: ""
  password: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  # Optional annotations on the aviso Service resource.
  annotations: {}

# Pod-level Kubernetes controls. Keep empty in base chart; override per environment.
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress is opt-in. Configure host/TLS in your override values.
# Example override:
# ingress:
#   enabled: true
#   className: nginx
#   hosts:
#     - host: aviso.example.com
#       paths:
#         - path: /
#           pathType: Prefix
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aviso.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Horizontal Pod Autoscaler. Disabled by default for predictable baseline behavior.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Conservative default resources for a single-replica baseline.
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Extra environment variables injected into the aviso-server container.
# Use this for secrets that should not live in the ConfigMap.
# Aviso supports AVISOSERVER_* env overrides on top of the config file.
# Example:
# extraEnv:
#   - name: AVISOSERVER_AUTH__JWT_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: aviso-auth-secret
#         key: jwt-secret
#   - name: AVISOSERVER_NOTIFICATION_BACKEND__JETSTREAM__TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: aviso-nats-secret
#         key: token
extraEnv: []

# Raw aviso-server configuration rendered into config.yaml.
config:
  application:
    host: "0.0.0.0"
    port: 8000
    # Used in generated CloudEvents source/schema URLs.
    base_url: "http://aviso-server"
    static_files_path: "/app/static"

  # Keep these aligned with aviso-server runtime defaults.
  watch_endpoint:
    sse_heartbeat_interval_sec: 30
    connection_max_duration_sec: 3600
    replay_batch_size: 100
    max_historical_notifications: 10000
    replay_batch_delay_ms: 100
    concurrent_notification_processing: 15

  notification_backend:
    # Base chart default: in-memory backend.
    kind: in_memory
    in_memory:
      max_history_per_topic: 1
      max_topics: 10000
      enable_metrics: false

    # External JetStream example (override file):
    # kind: jetstream
    # jetstream:
    #   nats_url: "nats://nats:4222"
    #   timeout_seconds: 30
    #   retry_attempts: 10
    #   max_messages: 500000
    #   max_bytes: 2147483648
    #   retention_time: "7d"
    #   storage_type: file
    #   replicas: 1
    #   retention_policy: limits
    #   discard_policy: old
    #   enable_auto_reconnect: true
    #   max_reconnect_attempts: 10
    #   reconnect_delay_ms: 1000
    #   publish_retry_attempts: 3
    #   publish_retry_base_delay_ms: 50

  logging:
    level: info
    # Compatibility field in aviso-server. Runtime output is structured JSON.
    format: json

  # Authentication and authorization (disabled by default).
  # When enabled, admin endpoints always require auth + admin_roles.
  # Stream endpoints enforce auth only when the schema sets auth.required: true.
  # jwt_secret must be injected via extraEnv (AVISOSERVER_AUTH__JWT_SECRET) — not here.
  # Example override:
  # auth:
  #   enabled: true
  #   mode: direct
  #   auth_o_tron_url: "http://RELEASE_NAME-auth-o-tron:8080"
  #   admin_roles:
  #     localrealm: ["admin"]
  #   timeout_ms: 5000
  auth:
    enabled: false
    mode: direct
    auth_o_tron_url: ""
    admin_roles: {}
    timeout_ms: 5000

  # Prometheus metrics endpoint (disabled by default).
  # Runs on a separate internal port. In Kubernetes, set host to "0.0.0.0" so the
  # service port can reach the metrics server inside the pod.
  # Example override:
  # metrics:
  #   enabled: true
  #   host: "0.0.0.0"
  #   port: 9090
  metrics:
    enabled: false
    # host: "127.0.0.1"
    # port: 9090
    # ServiceMonitor for Prometheus Operator discovery.
    # Requires metrics.enabled=true and a metrics port.
    serviceMonitor:
      enabled: false
      # interval: 30s
      # scrapeTimeout: 10s
      # Extra labels to match your Prometheus selector (e.g., release: prometheus).
      # labels: {}

  # Schema-backed event types can be provided via overrides under:
  # config.notification_schema.<event_type>.identifier.<field>
  # Each identifier field now uses a flat object:
  #   description: Optional human-readable text exposed by /api/v1/schema
  #   type:        Validation handler type (for example EnumHandler)
  #   required:    Whether the field is required
  #   <handler fields>: Handler-specific options (for example values, range, max_length)
  # Example:
  # notification_schema:
  #   my_event:
  #     identifier:
  #       region:
  #         description: "Geographic region label."
  #         type: EnumHandler
  #         values: ["north", "south"]
  #         required: true

# Optional bundled official NATS chart (default off; prefer explicit overrides).
# You can annotate subchart resources via official chart merge/patch points, for example:
# nats:
#   podTemplate:
#     merge:
#       metadata:
#         annotations:
#           key: value
#   service:
#     merge:
#       metadata:
#         annotations:
#           key: value
# When enabled for local/dev JetStream, override at least:
# nats:
#   enabled: true
#   config:
#     jetstream:
#       enabled: true
#       fileStore:
#         enabled: true
#         pvc:
#           enabled: true
#           size: 10Gi
nats:
  enabled: false

# Optional bundled auth-o-tron subchart (default off).
# When enabled, set config.auth.auth_o_tron_url to the in-cluster service URL:
#   config.auth.auth_o_tron_url: "http://RELEASE_NAME-auth-o-tron:8080"
# Override auth-o-tron-chart values under this key, for example:
# auth-o-tron:
#   enabled: true
#   config:
#     version: "2.0.0"
#     providers:
#       - name: "plain-provider"
#         type: "plain"
#         realm: "localrealm"
#         users:
#           - username: admin
#             password: admin
#     augmenters:
#       - name: "plain-role-augmenter"
#         type: "plain"
#         realm: "localrealm"
#         roles:
#           admin: ["admin"]
#   # Enable Prometheus metrics and ServiceMonitor for auth-o-tron.
#   metrics:
#     enabled: true
#     port: 9090
#     serviceMonitor:
#       enabled: true
#       interval: 30s
#       scrapeTimeout: 10s
auth-o-tron:
  enabled: false
